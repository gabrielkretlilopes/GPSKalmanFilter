<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How the filtered latitude and longitude are computed</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="470" fill="#FFFFFF"/>
<rect x="40" y="30" width="360" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Filtered North increment</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">rN = x_N[0] − previous x_N[0]</text>
<line x1="220" y1="86" x2="220" y2="114" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="116" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="135" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Distance along the heading</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">hv = rN / cos(bear)</text>
<line x1="220" y1="172" x2="220" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="202" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="221" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Angular distance</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">d = hv / 6,378,140 m</text>
<line x1="220" y1="258" x2="220" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="288" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="307" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Destination point on a sphere</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">from (lat_old, lng_old) with bearing = heading</text>
<line x1="220" y1="344" x2="220" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="374" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="393" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Filtered lat/lng</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="220.0" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">converted from radians to degrees</text>
<rect x="450" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="550.0" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">East position x_E[0]</text>
<text font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" x="550.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">not used in the output</text>
</svg>
